<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="1000" height="600" fill="#f8fafc" />
    
    <!-- Title -->
    <text x="500" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#b91c1c">Smart Garden Architecture</text>
    
    <!-- Physical Layer Box -->
    <rect x="50" y="90" width="900" height="160" rx="10" ry="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" />
    <text x="500" y="110" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#b91c1c">Physical Layer</text>
    
    <!-- Physical Layer Components -->
    <!-- Sensors Group -->
    <rect x="80" y="130" width="200" height="100" rx="8" ry="8" fill="white" stroke="#b91c1c" stroke-width="1" />
    <text x="180" y="150" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#b91c1c">Sensors</text>
    
    <!-- Individual Sensors -->
    <circle cx="110" cy="180" r="15" fill="#e5e7eb" stroke="#b91c1c" stroke-width="1" />
    <text x="110" y="185" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111827">S1</text>
    <text x="110" y="205" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">Soil</text>
    
    <circle cx="150" cy="180" r="15" fill="#e5e7eb" stroke="#b91c1c" stroke-width="1" />
    <text x="150" y="185" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111827">S2</text>
    <text x="150" y="205" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">Temp</text>
    
    <circle cx="190" cy="180" r="15" fill="#e5e7eb" stroke="#b91c1c" stroke-width="1" />
    <text x="190" y="185" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111827">S3</text>
    <text x="190" y="205" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">Light</text>
    
    <circle cx="230" cy="180" r="15" fill="#e5e7eb" stroke="#b91c1c" stroke-width="1" />
    <text x="230" y="185" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111827">S4</text>
    <text x="230" y="205" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">Humid</text>
    
    <!-- Microcontroller Group -->
    <rect x="400" y="130" width="200" height="100" rx="8" ry="8" fill="white" stroke="#b91c1c" stroke-width="1" />
    <text x="500" y="150" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#b91c1c">Microcontroller</text>
    
    <rect x="430" y="170" width="140" height="40" rx="5" ry="5" fill="#e5e7eb" stroke="#b91c1c" stroke-width="1" />
    <text x="500" y="195" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111827">ESP8266/ESP32</text>
    
    <!-- Actuators Group -->
    <rect x="720" y="130" width="200" height="100" rx="8" ry="8" fill="white" stroke="#b91c1c" stroke-width="1" />
    <text x="820" y="150" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#b91c1c">Actuators</text>
    
    <!-- Individual Actuators -->
    <rect x="745" y="170" width="60" height="30" rx="5" ry="5" fill="#e5e7eb" stroke="#b91c1c" stroke-width="1" />
    <text x="775" y="190" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111827">Pump</text>
    
    <rect x="835" y="170" width="60" height="30" rx="5" ry="5" fill="#e5e7eb" stroke="#b91c1c" stroke-width="1" />
    <text x="865" y="190" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111827">Solenoid</text>
    
    <!-- Communication Layer Box -->
    <rect x="50" y="270" width="900" height="120" rx="10" ry="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" />
    <text x="500" y="290" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Communication Layer</text>
    
    <!-- WiFi -->
    <rect x="140" y="310" width="140" height="60" rx="8" ry="8" fill="white" stroke="#1d4ed8" stroke-width="1" />
    <text x="210" y="345" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1d4ed8">WiFi</text>
    
    <!-- MQTT Broker -->
    <rect x="430" y="310" width="140" height="60" rx="8" ry="8" fill="white" stroke="#1d4ed8" stroke-width="1" />
    <text x="500" y="345" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1d4ed8">MQTT Broker</text>
    
    <!-- Internet/Cloud -->
    <rect x="720" y="310" width="140" height="60" rx="8" ry="8" fill="white" stroke="#1d4ed8" stroke-width="1" />
    <text x="790" y="345" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1d4ed8">Internet/Cloud</text>
    
    <!-- Application Layer Box -->
    <rect x="50" y="410" width="900" height="160" rx="10" ry="10" fill="#dcfce7" stroke="#166534" stroke-width="2" />
    <text x="500" y="430" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#166534">Application Layer</text>
    
    <!-- Database -->
    <rect x="100" y="460" width="140" height="60" rx="8" ry="8" fill="white" stroke="#166534" stroke-width="1" />
    <text x="170" y="495" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#166534">Database</text>
    <path d="M120,480 C120,470 220,470 220,480 L220,500 C220,510 120,510 120,500 Z" fill="none" stroke="#166534" stroke-width="1" />
    <path d="M120,480 C120,490 220,490 220,480" fill="none" stroke="#166534" stroke-width="1" />
    
    <!-- Backend Server -->
    <rect x="320" y="460" width="140" height="60" rx="8" ry="8" fill="white" stroke="#166534" stroke-width="1" />
    <text x="390" y="495" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#166534">Backend</text>
    
    <!-- Web/Mobile Frontend -->
    <rect x="540" y="460" width="140" height="60" rx="8" ry="8" fill="white" stroke="#166534" stroke-width="1" />
    <text x="610" y="495" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#166534">Web Frontend</text>
    
    <!-- Mobile App -->
    <rect x="760" y="460" width="140" height="60" rx="8" ry="8" fill="white" stroke="#166534" stroke-width="1" />
    <text x="830" y="495" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#166534">Mobile App</text>
    
    <!-- Connection Lines -->
    <!-- Sensors to Microcontroller -->
    <line x1="280" y1="180" x2="400" y2="180" stroke="#b91c1c" stroke-width="2" />
    <polygon points="395,175 405,180 395,185" fill="#b91c1c" />
    
    <!-- Microcontroller to Actuators -->
    <line x1="600" y1="180" x2="720" y2="180" stroke="#b91c1c" stroke-width="2" />
    <polygon points="715,175 725,180 715,185" fill="#b91c1c" />
    
    <!-- Microcontroller to WiFi -->
    <line x1="500" y1="230" x2="500" y2="280" stroke="#b91c1c" stroke-width="2" />
    <line x1="500" y1="280" x2="210" y2="310" stroke="#1d4ed8" stroke-width="2" />
    <polygon points="215,305 205,315 220,315" fill="#1d4ed8" />
    
    <!-- WiFi to MQTT Broker -->
    <line x1="280" y1="340" x2="430" y2="340" stroke="#1d4ed8" stroke-width="2" />
    <polygon points="425,335 435,340 425,345" fill="#1d4ed8" />
    
    <!-- MQTT Broker to Internet/Cloud -->
    <line x1="570" y1="340" x2="720" y2="340" stroke="#1d4ed8" stroke-width="2" />
    <polygon points="715,335 725,340 715,345" fill="#1d4ed8" />
    
    <!-- Internet/Cloud to Application Layer -->
    <line x1="790" y1="370" x2="790" y2="410" stroke="#1d4ed8" stroke-width="2" />
    <polygon points="785,405 790,415 795,405" fill="#166534" />
    
    <!-- Database Connections -->
    <line x1="170" y1="460" x2="170" y2="440" stroke="#166534" stroke-width="2" />
    <line x1="170" y1="440" x2="390" y2="440" stroke="#166534" stroke-width="2" />
    <line x1="390" y1="440" x2="390" y2="460" stroke="#166534" stroke-width="2" />
    <polygon points="385,455 390,465 395,455" fill="#166534" />
    
    <!-- Backend to Frontend Connections -->
    <line x1="460" y1="490" x2="540" y2="490" stroke="#166534" stroke-width="2" />
    <polygon points="535,485 545,490 535,495" fill="#166534" />
    
    <line x1="390" y1="520" x2="390" y2="540" stroke="#166534" stroke-width="2" />
    <line x1="390" y1="540" x2="830" y2="540" stroke="#166534" stroke-width="2" />
    <line x1="830" y1="540" x2="830" y2="520" stroke="#166534" stroke-width="2" />
    <polygon points="825,525 830,515 835,525" fill="#166534" />
    
    <!-- Bidirectional Arrows between Mobile and Web -->
    <line x1="680" y1="490" x2="760" y2="490" stroke="#166534" stroke-width="2" />
    <polygon points="755,485 765,490 755,495" fill="#166534" />
    <polygon points="685,485 675,490 685,495" fill="#166534" />
    
    <!-- Legend -->
    <rect x="50" y="580" width="140" height="15" fill="#fee2e2" />
    <text x="200" y="593" font-family="Arial, sans-serif" font-size="12" fill="#111827">Physical Layer</text>
    
    <rect x="300" y="580" width="140" height="15" fill="#dbeafe" />
    <text x="450" y="593" font-family="Arial, sans-serif" font-size="12" fill="#111827">Communication Layer</text>
    
    <rect x="550" y="580" width="140" height="15" fill="#dcfce7" />
    <text x="700" y="593" font-family="Arial, sans-serif" font-size="12" fill="#111827">Application Layer</text>
</svg>