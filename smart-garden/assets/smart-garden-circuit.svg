<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="1000" height="700" fill="#f8fafc" />
    
    <!-- Title -->
    <text x="500" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#b91c1c">Smart Garden Circuit Diagram</text>
    
    <!-- NodeMCU ESP8266 -->
    <rect x="380" y="120" width="240" height="350" rx="5" ry="5" fill="#fff" stroke="#b91c1c" stroke-width="2" />
    <text x="500" y="150" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#b91c1c">NodeMCU ESP8266</text>
    
    <!-- NodeMCU Pins -->
    <!-- Left side pins -->
    <rect x="365" y="180" width="25" height="15" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="350" y="192" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#374151">RST</text>
    
    <rect x="365" y="205" width="25" height="15" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="350" y="217" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#374151">A0</text>
    
    <rect x="365" y="230" width="25" height="15" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="350" y="242" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#374151">D0</text>
    
    <rect x="365" y="255" width="25" height="15" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="350" y="267" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#374151">D1/GPIO5</text>
    
    <rect x="365" y="280" width="25" height="15" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="350" y="292" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#374151">D2/GPIO4</text>
    
    <rect x="365" y="305" width="25" height="15" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="350" y="317" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#374151">D3</text>
    
    <rect x="365" y="330" width="25" height="15" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="350" y="342" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#374151">D4/GPIO2</text>
    
    <rect x="365" y="355" width="25" height="15" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="350" y="367" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#374151">3V3</text>
    
    <rect x="365" y="380" width="25" height="15" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="350" y="392" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#374151">GND</text>
    
    <!-- Right side pins -->
    <rect x="610" y="180" width="25" height="15" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="650" y="192" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#374151">Vin</text>
    
    <rect x="610" y="205" width="25" height="15" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="650" y="217" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#374151">GND</text>
    
    <rect x="610" y="230" width="25" height="15" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="650" y="242" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#374151">D8</text>
    
    <rect x="610" y="255" width="25" height="15" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="650" y="267" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#374151">D7</text>
    
    <rect x="610" y="280" width="25" height="15" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="650" y="292" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#374151">D6</text>
    
    <rect x="610" y="305" width="25" height="15" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="650" y="317" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#374151">D5</text>
    
    <rect x="610" y="330" width="25" height="15" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="650" y="342" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#374151">GND</text>
    
    <rect x="610" y="355" width="25" height="15" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="650" y="367" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#374151">3V3</text>
    
    <rect x="610" y="380" width="25" height="15" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="650" y="392" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#374151">5V</text>
    
    <!-- USB Connection -->
    <rect x="450" y="450" width="100" height="20" fill="#333" />
    <text x="500" y="465" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">USB</text>
    
    <!-- Soil Moisture Sensor -->
    <rect x="100" y="170" width="150" height="100" rx="5" ry="5" fill="#fff" stroke="#1d4ed8" stroke-width="2" />
    <text x="175" y="190" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Soil Moisture</text>
    <text x="175" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Sensor YL-69</text>
    
    <!-- Soil Moisture Pins -->
    <circle cx="130" cy="240" r="8" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="130" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">VCC</text>
    
    <circle cx="160" cy="240" r="8" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="160" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">GND</text>
    
    <circle cx="190" cy="240" r="8" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="190" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">DATA</text>
    
    <!-- DHT22 Sensor -->
    <rect x="100" y="330" width="150" height="100" rx="5" ry="5" fill="#fff" stroke="#1d4ed8" stroke-width="2" />
    <text x="175" y="360" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d4ed8">DHT22</text>
    <text x="175" y="380" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1d4ed8">Temperature &</text>
    <text x="175" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1d4ed8">Humidity Sensor</text>
    
    <!-- DHT22 Pins -->
    <circle cx="130" cy="420" r="8" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="130" y="440" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">VCC</text>
    
    <circle cx="160" cy="420" r="8" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="160" y="440" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">DATA</text>
    
    <circle cx="190" cy="420" r="8" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="190" y="440" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">GND</text>

    <!-- 5V Relay Module -->
    <rect x="750" y="170" width="180" height="120" rx="5" ry="5" fill="#fff" stroke="#166534" stroke-width="2" />
    <text x="840" y="190" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#166534">5V Relay Module</text>
    
    <!-- Relay internals -->
    <rect x="780" y="210" width="120" height="60" rx="2" ry="2" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    
    <!-- Relay Control Pins -->
    <circle cx="780" cy="240" r="8" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="780" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">VCC</text>
    
    <circle cx="810" cy="240" r="8" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="810" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">GND</text>
    
    <circle cx="840" cy="240" r="8" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="840" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">IN</text>
    
    <!-- Relay Power Terminals -->
    <rect x="770" y="180" width="15" height="15" fill="#e11d48" stroke="#333" stroke-width="1" />
    <text x="778" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">COM</text>
    
    <rect x="795" y="180" width="15" height="15" fill="#e11d48" stroke="#333" stroke-width="1" />
    <text x="803" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">NO</text>
    
    <rect x="820" y="180" width="15" height="15" fill="#e11d48" stroke="#333" stroke-width="1" />
    <text x="828" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">NC</text>
    
    <!-- Solenoid Valve -->
    <rect x="750" y="350" width="180" height="100" rx="5" ry="5" fill="#fff" stroke="#166534" stroke-width="2" />
    <text x="840" y="370" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#166534">12V Solenoid Valve</text>
    
    <!-- Solenoid Valve Shape -->
    <path d="M790,390 L810,390 L825,410 L775,410 Z" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <path d="M800,410 L800,430" stroke="#333" stroke-width="3" />
    <circle cx="800" cy="440" r="5" fill="#333" />
    
    <!-- Solenoid Terminals -->
    <rect x="860" y="400" width="15" height="15" fill="#e11d48" stroke="#333" stroke-width="1" />
    <text x="868" y="425" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">+</text>
    
    <rect x="885" y="400" width="15" height="15" fill="#333" stroke="#333" stroke-width="1" />
    <text x="893" y="425" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">-</text>

    <!-- Power Supply -->
    <rect x="380" y="520" width="240" height="120" rx="5" ry="5" fill="#fff" stroke="#b91c1c" stroke-width="2" />
    <text x="500" y="540" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#b91c1c">Power Supply</text>
    
    <!-- 12V Adapter -->
    <rect x="400" y="560" width="80" height="60" rx="3" ry="3" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="440" y="590" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">12V Adapter</text>
    
    <!-- 5V Regulator -->
    <rect x="520" y="560" width="80" height="60" rx="3" ry="3" fill="#e5e7eb" stroke="#333" stroke-width="1" />
    <text x="560" y="590" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">5V Regulator</text>
    
    <!-- Connection Lines -->
    <!-- Soil Moisture Sensor to NodeMCU -->
    <!-- VCC to 3V3 -->
    <line x1="130" y1="240" x2="130" y2="320" stroke="#1d4ed8" stroke-width="2" />
    <line x1="130" y1="320" x2="350" y2="320" stroke="#1d4ed8" stroke-width="2" />
    <line x1="350" y1="320" x2="350" y2="355" stroke="#1d4ed8" stroke-width="2" />
    <line x1="350" y1="355" x2="365" y2="355" stroke="#1d4ed8" stroke-width="2" />
    
    <!-- GND to GND -->
    <line x1="160" y1="240" x2="160" y2="300" stroke="#333" stroke-width="2" />
    <line x1="160" y1="300" x2="350" y2="300" stroke="#333" stroke-width="2" />
    <line x1="350" y1="300" x2="350" y2="380" stroke="#333" stroke-width="2" />
    <line x1="350" y1="380" x2="365" y2="380" stroke="#333" stroke-width="2" />
    
    <!-- DATA to A0 -->
    <line x1="190" y1="240" x2="190" y2="280" stroke="#1d4ed8" stroke-width="2" />
    <line x1="190" y1="280" x2="340" y2="280" stroke="#1d4ed8" stroke-width="2" />
    <line x1="340" y1="280" x2="340" y2="205" stroke="#1d4ed8" stroke-width="2" />
    <line x1="340" y1="205" x2="365" y2="205" stroke="#1d4ed8" stroke-width="2" />
    
    <!-- DHT22 to NodeMCU -->
    <!-- VCC to 3V3 -->
    <line x1="130" y1="420" x2="130" y2="460" stroke="#1d4ed8" stroke-width="2" />
    <line x1="130" y1="460" x2="340" y2="460" stroke="#1d4ed8" stroke-width="2" />
    <line x1="340" y1="460" x2="340" y2="365" stroke="#1d4ed8" stroke-width="2" />
    <line x1="340" y1="365" x2="365" y2="365" stroke="#1d4ed8" stroke-width="2" />
    
    <!-- DATA to D4/GPIO2 -->
    <line x1="160" y1="420" x2="160" y2="440" stroke="#1d4ed8" stroke-width="2" />
    <line x1="160" y1="440" x2="330" y2="440" stroke="#1d4ed8" stroke-width="2" />
    <line x1="330" y1="440" x2="330" y2="330" stroke="#1d4ed8" stroke-width="2" />
    <line x1="330" y1="330" x2="365" y2="330" stroke="#1d4ed8" stroke-width="2" />
    
    <!-- GND to GND -->
    <line x1="190" y1="420" x2="190" y2="470" stroke="#333" stroke-width="2" />
    <line x1="190" y1="470" x2="320" y2="470" stroke="#333" stroke-width="2" />
    <line x1="320" y1="470" x2="320" y2="390" stroke="#333" stroke-width="2" />
    <line x1="320" y1="390" x2="365" y2="390" stroke="#333" stroke-width="2" />
    
    <!-- Relay to NodeMCU -->
    <!-- VCC to 5V -->
    <line x1="780" y1="240" x2="760" y2="240" stroke="#166534" stroke-width="2" />
    <line x1="760" y1="240" x2="760" y2="390" stroke="#166534" stroke-width="2" />
    <line x1="760" y1="390" x2="660" y2="390" stroke="#166534" stroke-width="2" />
    <line x1="660" y1="390" x2="660" y2="380" stroke="#166534" stroke-width="2" />
    <line x1="660" y1="380" x2="635" y2="380" stroke="#166534" stroke-width="2" />
    
    <!-- GND to GND -->
    <line x1="810" y1="240" x2="750" y2="240" stroke="#333" stroke-width="2" />
    <line x1="750" y1="240" x2="750" y2="350" stroke="#333" stroke-width="2" />
    <line x1="750" y1="350" x2="670" y2="350" stroke="#333" stroke-width="2" />
    <line x1="670" y1="350" x2="670" y2="330" stroke="#333" stroke-width="2" />
    <line x1="670" y1="330" x2="635" y2="330" stroke="#333" stroke-width="2" />
    
    <!-- IN to D2/GPIO4 -->
    <line x1="840" y1="240" x2="740" y2="240" stroke="#166534" stroke-width="2" />
    <line x1="740" y1="240" x2="740" y2="310" stroke="#166534" stroke-width="2" />
    <line x1="740" y1="310" x2="680" y2="310" stroke="#166534" stroke-width="2" />
    <line x1="680" y1="310" x2="680" y2="280" stroke="#166534" stroke-width="2" />
    <line x1="680" y1="280" x2="635" y2="280" stroke="#166534" stroke-width="2" />
    
    <!-- Relay to Solenoid -->
    <!-- COM to Solenoid + -->
    <line x1="777" y1="180" x2="777" y2="140" stroke="#e11d48" stroke-width="2" />
    <line x1="777" y1="140" x2="868" y2="140" stroke="#e11d48" stroke-width="2" />
    <line x1="868" y1="140" x2="868" y2="400" stroke="#e11d48" stroke-width="2" />
    
    <!-- NO to 12V + -->
    <line x1="803" y1="180" x2="803" y2="150" stroke="#e11d48" stroke-width="2" />
    <line x1="803" y1="150" x2="440" y2="150" stroke="#e11d48" stroke-width="2" />
    <line x1="440" y1="150" x2="440" y2="560" stroke="#e11d48" stroke-width="2" />
    
    <!-- Solenoid - to GND -->
    <line x1="893" y1="400" x2="893" y2="490" stroke="#333" stroke-width="2" />
    <line x1="893" y1="490" x2="510" y2="490" stroke="#333" stroke-width="2" />
    <line x1="510" y1="490" x2="510" y2="560" stroke="#333" stroke-width="2" />
    
    <!-- Power Supply to NodeMCU -->
    <!-- 5V Regulator to Vin -->
    <line x1="560" y1="560" x2="560" y2="510" stroke="#b91c1c" stroke-width="2" />
    <line x1="560" y1="510" x2="670" y2="510" stroke="#b91c1c" stroke-width="2" />
    <line x1="670" y1="510" x2="670" y2="180" stroke="#b91c1c" stroke-width="2" />
    <line x1="670" y1="180" x2="635" y2="180" stroke="#b91c1c" stroke-width="2" />
    
    <!-- Legend -->
    <rect x="50" y="620" width="140" height="15" fill="#fff" stroke="#1d4ed8" stroke-width="2" />
    <text x="200" y="633" font-family="Arial, sans-serif" font-size="12" fill="#1d4ed8">Sensors</text>
    
    <rect x="250" y="620" width="140" height="15" fill="#fff" stroke="#b91c1c" stroke-width="2" />
    <text x="400" y="633" font-family="Arial, sans-serif" font-size="12" fill="#b91c1c">Microcontroller/Power</text>
    
    <rect x="450" y="620" width="140" height="15" fill="#fff" stroke="#166534" stroke-width="2" />
    <text x="600" y="633" font-family="Arial, sans-serif" font-size="12" fill="#166534">Actuators</text>
    
    <rect x="650" y="620" width="50" height="15" fill="#1d4ed8" />
    <text x="710" y="633" font-family="Arial, sans-serif" font-size="12" fill="#1d4ed8">Signal</text>
    
    <rect x="750" y="620" width="50" height="15" fill="#333" />
    <text x="810" y="633" font-family="Arial, sans-serif" font-size="12" fill="#333">Ground</text>
    
    <rect x="850" y="620" width="50" height="15" fill="#e11d48" />
    <text x="910" y="633" font-family="Arial, sans-serif" font-size="12" fill="#e11d48">Power</text>
    
    <!-- Notes -->
    <text x="500" y="670" font-family="Arial, sans-serif" font-size="14" font-style="italic" text-anchor="middle" fill="#6b7280">Note: Capacitors and resistors omitted for clarity. 
    A 10kΩ pull-up resistor is recommended for the DHT22 data line.</text>
</svg>